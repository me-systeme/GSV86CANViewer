# -----------------------------------------------------------------------------
# config.yaml
#
# Project configuration for the GSV86CANViewer application.
#
# Structure overview:
# - dll:      Low-level DLL / CAN settings
# - logging:  Output file configuration and downsample rate for recording
# - devices:  Device CAN IDs and measurement frequency
# - sensors:  Sensor metadata used to compute scaling factors
# - sensor_mapping: Mapping of sensors -> device/channel
# -----------------------------------------------------------------------------


# -----------------------------------------------------------------------------
# DLL / CAN configuration
# -----------------------------------------------------------------------------
dll:
  # Maximum number of samples the DLL buffer stores per device read cycle.
  # This value is used to size read_multiple() calls and affects latency/throughput.
  mybuffersize: 300

  # CAN bus baud rate in bits per second.
  canbaud: 250000

# -----------------------------------------------------------------------------
# Logging configuration
# -----------------------------------------------------------------------------
logging:
  # Output file path (relative to project root).
  # If empty or commented out, the REC UI is disabled and no file is written.
  # file: ""
  # file: "messdaten.csv"
  # file: "logs/messdaten.xlsx"
  file: "messdaten.xlsx"

  # Logging rate in Hz (downsampling done in MainWindow.on_values()).
  # Example:
  # - 1.0  => 1 row per second
  # - 10.0 => 10 rows per second
  rate_hz: 1.0

  # mode:
  # - hold_last:
  #     Missing values are filled using the last known measurement value.
  #     Good for fully populated tables, but may hide device dropouts.
  #
  # - strict_samples:
  #     Only values actually received during the current logging interval
  #     are written.
  #     If no fresh value arrives for a channel during that interval,
  #     the cell remains empty.
  mode: "strict_samples"

  # Only used in strict_samples mode:
  # Show a warning if fresh values are missing during a logging interval.
  warn_on_missing: true

# -----------------------------------------------------------------------------
# Device configuration
# -----------------------------------------------------------------------------
devices:
  # Measurement frequency (Hz) for all devices.
  # If set, it overrides per-device frequency entries below.
  # If not set, either the per-devices configuration is applied or the current frequency will not be changed
  #
  # Note: your setup suggests stability issues above ~100 Hz, so keep <= 100.
  frequency: 10


  # Optional startup behavior

  # Calls load_settings(dataset=1)
  # Sets settings of all devices to default settings
  # When your devices are already configured correctly, please set this to false
  load_default_settings: true        

  # Adjusts sensitivity if needed
  # Sensitivity of the devices should be larger than char_value of the sensors 
  # If you get a warning like "measuring range limited" then please set to true
  auto_sensitivity_adjustment: true   

  # Per-device CAN configuration
  config:
    - dev_no: 1
      serial: 25455437
      cmd_id: '0x102'
      answer_id: '0x103'
    - dev_no: 2
      serial: 25455423
      cmd_id: '0x104'
      answer_id: '0x105'
    - dev_no: 3
      serial: 25455439
      cmd_id: '0x106'
      answer_id: '0x107'

# -----------------------------------------------------------------------------
# Sensor metadata (used to compute scaling factors in ReaderThread)
# -----------------------------------------------------------------------------
sensors:
